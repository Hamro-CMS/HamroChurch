name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: repo/.nvmrc
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: pwsh
        working-directory: repo
        run: |
          npm ci --ignore-scripts

      - name: Prepare NDI SDK
        shell: pwsh
        working-directory: repo
        run: |
          npm run prepare:grandiose-ndi

      - name: Rebuild Electron native dependencies
        shell: pwsh
        working-directory: repo
        env:
          npm_config_msvs_version: "2022"
        run: |
          npx electron-rebuild --version 37.10.3 --arch x64 --module-dir . --only @discordjs/opus,better-sqlite3,libltc-wrapper,macadam --sequential

      - name: Rebuild grandiose for Electron
        shell: pwsh
        working-directory: repo\node_modules\grandiose
        env:
          npm_config_msvs_version: "2022"
        run: |
          npx node-gyp rebuild --runtime=electron --target=37.10.3 --dist-url=https://electronjs.org/headers --arch=x64

      - name: Verify rebuilt native binaries
        shell: pwsh
        working-directory: repo
        run: |
          if (-not (Test-Path .\node_modules\grandiose\build\Release\grandiose.node)) {
            throw "grandiose.node was not rebuilt successfully."
          }
          if (-not (Test-Path .\node_modules\better-sqlite3\build\Release\better_sqlite3.node)) {
            throw "better_sqlite3.node was not rebuilt successfully."
          }

      - name: Build production bundles
        shell: pwsh
        working-directory: repo
        run: |
          npm run build

      - name: Build installer artifacts
        shell: pwsh
        working-directory: repo
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --config config/building/electron-builder.yaml --config.npmRebuild=false --config.win.signtoolOptions.sign=scripts/skipWindowsSign.js --publish never

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ github.ref_name }}
          path: |
            repo/dist/*.exe
            repo/dist/*.exe.blockmap
            repo/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build_windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
