name: Build Android Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-remote/**"
      - ".github/workflows/build-android-remote.yml"
  pull_request:
    paths:
      - "android-remote/**"

permissions:
  contents: read

jobs:
  android_remote:
    name: Test, Lint & Build Android Remote
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-remote

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests & lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Build Release & Debug APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Aradhana Studio Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: AradhanaStudio-Remote-APK
          path: |
            android-remote/app/build/outputs/apk/release/*.apk
            android-remote/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
