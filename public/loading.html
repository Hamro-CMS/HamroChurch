<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Aradhana Studio - Loading</title>
        <link rel="icon" href="./aradhanastudio.png" />

        <link rel="stylesheet" href="global.css" />

        <style>
            :root {
                --radius: 12px;
                --loader-height: 3px;
            }

            main {
                background-color: #0b1324;
                background: radial-gradient(circle at 50% 35%, #152847 0%, #070d19 88%);
                width: 100%;
                height: 100%;
                border-radius: var(--radius);
                border: 1px solid rgba(56, 189, 248, 0.22);
                box-sizing: border-box;

                display: flex;
                flex-direction: column;
                gap: 10px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
                padding: 18px 24px;
            }

            .splash-logo {
                width: min(330px, 78%);
                max-height: 165px;
                object-fit: contain;
                filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
            }

            .meta {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 4px;
                font-size: 0.85em;
                color: rgba(248, 250, 252, 0.72);
                letter-spacing: 0.03em;
            }

            .subtitle {
                font-weight: 600;
                color: #38bdf8;
            }

            .v {
                opacity: 0.7;
            }

            .loader {
                --margin: 2px;
                background-color: rgba(255, 255, 255, 0.08);
                margin: 0 var(--margin);
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;

                position: absolute;
                top: 0;
                width: calc(100% - (var(--margin) * 2));
                height: var(--loader-height);

                overflow: hidden;
            }

            .loader span:before {
                content: "";
                position: absolute;
                height: 100%;
                background: linear-gradient(90deg, #0284c7, #38bdf8, #f59e0b);
                animation: first 1.8s infinite ease-out;
            }

            .loader span:after {
                content: "";
                position: absolute;
                height: 100%;
                background: linear-gradient(90deg, #f59e0b, #38bdf8, #0284c7);
                animation: second 1.8s infinite ease-in;
            }

            @keyframes first {
                0% {
                    inset-inline-start: -100%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }

            @keyframes second {
                0% {
                    inset-inline-start: -150%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <span></span>
        </div>

        <main>
            <img class="splash-logo" src="./logo-splash.png" alt="Aradhana Studio (आराधना स्टुडियो)" draggable="false" />

            <div class="meta">
                <span class="subtitle">Aradhana Studio • आराधना स्टुडियो</span>
                <span class="v">v<span class="version">0.0.0</span></span>
            </div>
        </main>

        <script>
            const versionParam = new URLSearchParams(window.location.search).get("version")
            if (versionParam) {
                const versionElem = document.querySelector(".version")
                if (versionElem) versionElem.textContent = versionParam
            }
        </script>
    </body>
</html>
